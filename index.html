<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Night Count - Bar Inventory</title>
    
    <!-- Google Fonts & Reset -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0D1117;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Hide scrollbars for a cleaner app feel, while keeping functionality */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>

    <!-- React, ReactDOM, and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <!-- React Application Logic -->
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const FILL_LEVELS = [
          { value: 1.0, label: "10/10", short: "10", color: "#C9A84C" },
          { value: 0.9, label: "9/10", short: "9", color: "#C4A148" },
          { value: 0.8, label: "8/10", short: "8", color: "#BE9A43" },
          { value: 0.7, label: "7/10", short: "7", color: "#B5903C" },
          { value: 0.6, label: "6/10", short: "6", color: "#A98436" },
          { value: 0.5, label: "5/10", short: "5", color: "#9A7A30" },
          { value: 0.4, label: "4/10", short: "4", color: "#8A6E2A" },
          { value: 0.3, label: "3/10", short: "3", color: "#7A6024" },
          { value: 0.2, label: "2/10", short: "2", color: "#6A521E" },
          { value: 0.1, label: "1/10", short: "1", color: "#5A4418" },
          { value: 0.0, label: "Empty", short: "E", color: "#3A2E1F" }
        ];

        const CATEGORIES = ["Whiskey", "Vodka", "Gin", "Rum", "Tequila", "Liqueur", "Wine"];

        const DEFAULT_BOTTLES = [
          { id: 1, name: "Maker's Mark", category: "Whiskey", par: 0.5 },
          { id: 2, name: "Buffalo Trace", category: "Whiskey", par: 0.5 },
          { id: 3, name: "Jack Daniel's", category: "Whiskey", par: 0.25 },
          { id: 4, name: "Tito's Vodka", category: "Vodka", par: 0.5 },
          { id: 5, name: "Grey Goose", category: "Vodka", par: 0.5 },
          { id: 6, name: "Tanqueray", category: "Gin", par: 0.5 },
          { id: 7, name: "Hendrick's", category: "Gin", par: 0.25 },
          { id: 8, name: "Bacardi White", category: "Rum", par: 0.5 },
          { id: 9, name: "Myers's Dark", category: "Rum", par: 0.25 },
          { id: 10, name: "Casamigos Blanco", category: "Tequila", par: 0.5 },
          { id: 11, name: "Patrón Silver", category: "Tequila", par: 0.5 },
          { id: 12, name: "Cointreau", category: "Liqueur", par: 0.25 },
          { id: 13, name: "Kahlúa", category: "Liqueur", par: 0.25 },
          { id: 14, name: "Aperol", category: "Liqueur", par: 0.25 }
        ];

        function getTodayKey() {
          return new Date().toISOString().slice(0, 10);
        }

        function formatDate(dateStr) {
          return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", {
            weekday: "long", month: "long", day: "numeric", year: "numeric"
          });
        }

        function BottleGauge({ fill, onChange }) {
          const segments = [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0];
          
          return (
            <div style={{ display: "flex", flexDirection: "column", gap: 2, alignItems: "center" }}>
              {segments.map((seg, i) => {
                const filled = fill != null && fill > 0 ? seg > 0 && seg <= fill : false;
                const isSelected = fill === seg;
                const level = FILL_LEVELS.find(l => l.value === seg) || { color: "#3A2E1F", label: "" };
                
                return (
                  <button
                    key={seg}
                    onClick={() => onChange(isSelected ? null : seg)}
                    title={level.label}
                    style={{
                      width: 28,
                      height: 13,
                      borderRadius: i === 0 ? "5px 5px 2px 2px" : i === segments.length - 1 ? "2px 2px 5px 5px" : "2px",
                      background: filled ? level.color : "#1C2333",
                      border: isSelected ? "2px solid #E8E0D0" : "1px solid #2D3748",
                      cursor: "pointer",
                      transition: "background 0.1s ease",
                      boxShadow: isSelected ? `0 0 5px ${level.color}99` : "none",
                      padding: 0,
                    }}
                  />
                );
              })}
            </div>
          );
        }

        function BottleCard({ bottle, entry, onUpdate, onDelete }) {
          const [showNotes, setShowNotes] = useState(false);
          const belowPar = entry.fill != null && entry.fill < bottle.par;
          const noCount = entry.fill === null;

          return (
            <div style={{
              background: "#1C2333",
              border: `1px solid ${belowPar ? "#C9643C55" : noCount ? "#2D3748" : "#C9A84C"}`,
              borderRadius: 12,
              padding: "14px 12px",
              display: "flex",
              flexDirection: "column",
              gap: 8,
              position: "relative",
            }}>
              {belowPar && (
                <div style={{
                  position: "absolute", top: 8, right: 8,
                  background: "#C9643C", borderRadius: 4,
                  fontSize: 9, color: "#fff", fontWeight: 700,
                  padding: "2px 5px", letterSpacing: "0.05em"
                }}>ORDER</div>
              )}
              
              <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                <BottleGauge fill={entry.fill} onChange={val => onUpdate({ fill: val })} />
                
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{
                    fontFamily: "'Playfair Display', serif",
                    color: "#E8E0D0", fontSize: 14, fontWeight: 600,
                    lineHeight: 1.2, marginBottom: 4
                  }}>{bottle.name}</div>
                  <div style={{ fontSize: 11, color: "#6B7280", marginBottom: 6 }}>{bottle.category}</div>
                  
                  <div style={{
                    fontSize: 12,
                    color: entry.fill != null ? "#C9A84C" : "#4B5563",
                    fontWeight: 600
                  }}>
                    {entry.fill !== null ? FILL_LEVELS.find(l => l.value === entry.fill)?.label : "Tap gauge →"}
                  </div>

                  {entry.fill !== null && (
                    <div style={{ marginTop: 4 }}>
                      <div style={{ height: 3, borderRadius: 2, background: "#2D3748", width: "100%" }}>
                        <div style={{
                          height: 3, borderRadius: 2,
                          background: belowPar ? "#C9643C" : "#C9A84C",
                          width: `${entry.fill * 100}%`,
                          transition: "width 0.3s ease"
                        }} />
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                <button
                  onClick={() => setShowNotes(s => !s)}
                  style={{
                    background: "none", border: "1px solid #2D3748",
                    borderRadius: 4, padding: "3px 7px", fontSize: 10,
                    color: entry.notes ? "#C9A84C" : "#6B7280", cursor: "pointer"
                  }}
                >
                  {entry.notes ? "✓ Note" : "+ Note"}
                </button>
                <button
                  onClick={() => onDelete(bottle.id)}
                  style={{
                    background: "none", border: "none",
                    color: "#4B5563", cursor: "pointer", fontSize: 11, marginLeft: "auto"
                  }}
                >x</button>
              </div>

              {showNotes && (
                <textarea
                  placeholder="Add a note..."
                  value={entry.notes || ""}
                  onChange={e => onUpdate({ notes: e.target.value })}
                  rows={2}
                  style={{
                    width: "100%", background: "#0D1117", border: "1px solid #2D3748",
                    borderRadius: 6, padding: "6px 8px", color: "#E8E0D0",
                    fontSize: 12, resize: "vertical", fontFamily: "Inter, sans-serif",
                    boxSizing: "border-box"
                  }}
                />
              )}
            </div>
          );
        }

        function AddBottleModal({ onAdd, onClose }) {
          const [name, setName] = useState("");
          const [category, setCategory] = useState("Whiskey");
          const [par, setPar] = useState("0.5");

          const submit = () => {
            if (!name.trim()) return;
            onAdd({ name: name.trim(), category, par: parseFloat(par) });
            onClose();
          };

          return (
            <div style={{
              position: "fixed", inset: 0, background: "#00000088", zIndex: 100,
              display: "flex", alignItems: "center", justifyContent: "center", padding: 16
            }} onClick={onClose}>
              <div style={{
                background: "#1C2333", borderRadius: 14, padding: 24, width: "100%", maxWidth: 340,
                border: "1px solid #2D3748"
              }} onClick={e => e.stopPropagation()}>
                <div style={{ fontFamily: "'Playfair Display', serif", color: "#E8E0D0", fontSize: 18, fontWeight: 600, marginBottom: 16 }}>
                  Add Bottle
                </div>
                
                <label style={{ fontSize: 11, color: "#6B7280", display: "block", marginBottom: 4 }}>BOTTLE NAME</label>
                <input
                  autoFocus
                  value={name}
                  onChange={e => setName(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && submit()}
                  placeholder="e.g. Woodford Reserve"
                  style={{
                    width: "100%", background: "#0D1117", border: "1px solid #2D3748",
                    borderRadius: 8, padding: "10px 12px", color: "#E8E0D0",
                    fontSize: 14, marginBottom: 14, boxSizing: "border-box"
                  }}
                />

                <label style={{ fontSize: 11, color: "#6B7280", display: "block", marginBottom: 4 }}>CATEGORY</label>
                <select
                  value={category}
                  onChange={e => setCategory(e.target.value)}
                  style={{
                    width: "100%", background: "#0D1117", border: "1px solid #2D3748",
                    borderRadius: 8, padding: "10px 12px", color: "#E8E0D0",
                    fontSize: 14, marginBottom: 14, boxSizing: "border-box"
                  }}
                >
                  {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                </select>

                <label style={{ fontSize: 11, color: "#6B7280", display: "block", marginBottom: 4 }}>PAR LEVEL (ORDER THRESHOLD)</label>
                <select
                  value={par}
                  onChange={e => setPar(e.target.value)}
                  style={{
                    width: "100%", background: "#0D1117", border: "1px solid #2D3748",
                    borderRadius: 8, padding: "10px 12px", color: "#E8E0D0",
                    fontSize: 14, marginBottom: 20, boxSizing: "border-box"
                  }}
                >
                  {[1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1].map(v => (
                    <option key={v} value={v}>{FILL_LEVELS.find(l => l.value === v)?.label}</option>
                  ))}
                </select>

                <div style={{ display: "flex", gap: 10 }}>
                  <button onClick={onClose} style={{
                    flex: 1, background: "none", border: "1px solid #2D3748",
                    borderRadius: 8, padding: 10, color: "#6B7280", cursor: "pointer", fontSize: 14
                  }}>Cancel</button>
                  <button onClick={submit} style={{
                    flex: 1, background: "#C9A84C", border: "none",
                    borderRadius: 8, padding: 10, color: "#0D1117", cursor: "pointer",
                    fontSize: 14, fontWeight: 700
                  }}>Add Bottle</button>
                </div>
              </div>
            </div>
          );
        }

        function HistoryView({ history, onClose }) {
          return (
            <div style={{
              position: "fixed", inset: 0, background: "#0D1117", zIndex: 50,
              overflowY: "auto", padding: "20px 16px"
            }}>
              <div style={{ maxWidth: 500, margin: "0 auto" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
                  <button onClick={onClose} style={{ background: "none", border: "none", color: "#6B7280", cursor: "pointer", fontSize: 20 }}>←</button>
                  <div style={{ fontFamily: "'Playfair Display', serif", color: "#E8E0D0", fontSize: 20, fontWeight: 600 }}>History Logs</div>
                </div>
                
                {history.length === 0 ? (
                  <div style={{ color: "#4B5563", textAlign: "center", marginTop: 60 }}>No history logs recorded yet.</div>
                ) : (
                  history.slice().reverse().map(snapshot => (
                    <div key={snapshot.date} style={{
                      background: "#1C2333", borderRadius: 12, padding: 16, marginBottom: 14,
                      border: "1px solid #2D3748"
                    }}>
                      <div style={{ fontFamily: "'Playfair Display', serif", color: "#C9A84C", fontSize: 15, fontWeight: 600, marginBottom: 10 }}>
                        {formatDate(snapshot.date)}
                      </div>
                      
                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                        {snapshot.entries.map(e => (
                          <div key={e.bottleId} style={{
                            display: "flex", justifyContent: "space-between",
                            fontSize: 13, color: "#E8E0D0", paddingBottom: 6, borderBottom: "1px solid #2D374833"
                          }}>
                            <span>{e.name}</span>
                            <span style={{ color: e.fill !== null ? "#C9A84C" : "#4B5563" }}>
                              {e.fill != null ? FILL_LEVELS.find(l => l.value === e.fill)?.label : "Uncounted"}
                            </span>
                          </div>
                        ))}
                      </div>

                      {snapshot.orderList?.length > 0 && (
                        <div style={{ marginTop: 12, paddingTop: 10, borderTop: "1px dashed #C9643C33" }}>
                          <div style={{ fontSize: 10, color: "#C9643C", fontWeight: 700, marginBottom: 4, letterSpacing: "0.05em" }}>REORDER NEEDED:</div>
                          {snapshot.orderList.map(name => (
                            <div key={name} style={{ fontSize: 12, color: "#C9643C", fontWeight: 500 }}>• {name}</div>
                          ))}
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>
            </div>
          );
        }

        function BarInventory() {
          const [bottles, setBottles] = useState(DEFAULT_BOTTLES);
          const [entries, setEntries] = useState({});
          const [activeCategory, setActiveCategory] = useState("All");
          const [showAdd, setShowAdd] = useState(false);
          const [showHistory, setShowHistory] = useState(false);
          const [history, setHistory] = useState([]);
          const [saved, setSaved] = useState(false);
          const [loaded, setLoaded] = useState(false);
          const [nextId, setNextId] = useState(100);

          useEffect(() => {
            try {
              const storedBottles = localStorage.getItem("bottles");
              if (storedBottles) setBottles(JSON.parse(storedBottles));
              
              const storedNextId = localStorage.getItem("nextId");
              if (storedNextId) setNextId(JSON.parse(storedNextId));
              
              const storedEntries = localStorage.getItem(`entries:${getTodayKey()}`);
              if (storedEntries) setEntries(JSON.parse(storedEntries));
              
              const storedHist = localStorage.getItem("history");
              if (storedHist) setHistory(JSON.parse(storedHist));
            } catch (e) {
              console.error("Failed to load inventory data", e);
            }
            setLoaded(true);
          }, []);

          const usedCategories = ["All", ...CATEGORIES.filter(c => bottles.some(b => b.category === c))];

          const updateEntry = useCallback((bottleId, patch) => {
            setEntries(prev => {
              const current = prev[bottleId] || { fill: null, notes: "" };
              return {
                ...prev,
                [bottleId]: { ...current, ...patch }
              };
            });
            setSaved(false);
          }, []);

          const deleteBottle = useCallback((id) => {
            setBottles(prev => {
              const next = prev.filter(b => b.id !== id);
              localStorage.setItem("bottles", JSON.stringify(next));
              return next;
            });
            setEntries(prev => {
              const next = { ...prev };
              delete next[id];
              return next;
            });
          }, []);

          const addBottle = useCallback(({ name, category, par }) => {
            const id = nextId;
            const newBottle = { id, name, category, par };
            const newNextId = nextId + 1;
            
            setNextId(newNextId);
            setBottles(prev => {
              const next = [...prev, newBottle];
              localStorage.setItem("bottles", JSON.stringify(next));
              return next;
            });
            localStorage.setItem("nextId", JSON.stringify(newNextId));
          }, [nextId]);

          const saveCount = useCallback(() => {
            const today = getTodayKey();
            localStorage.setItem(`entries:${today}`, JSON.stringify(entries));
            
            const snapshot = {
              date: today,
              entries: bottles.map(b => ({
                bottleId: b.id,
                name: b.name,
                fill: entries[b.id]?.fill ?? null,
                notes: entries[b.id]?.notes ?? ""
              })),
              orderList: bottles
                .filter(b => entries[b.id]?.fill != null && entries[b.id].fill < b.par)
                .map(b => b.name)
            };

            const newHistory = [...history.filter(h => h.date !== today), snapshot];
            setHistory(newHistory);
            localStorage.setItem("history", JSON.stringify(newHistory));
            setSaved(true);
          }, [bottles, entries, history]);

          const counted = bottles.filter(b => entries[b.id]?.fill != null).length;
          const orderCount = bottles.filter(b => entries[b.id]?.fill != null && entries[b.id].fill < b.par).length;
          
          const filtered = activeCategory === "All" 
            ? bottles 
            : bottles.filter(b => b.category === activeCategory);

          if (!loaded) {
            return (
              <div style={{ background: "#0D1117", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <div style={{ color: "#C9A84C", fontFamily: "'Playfair Display', serif", fontSize: 18 }}>Loading Inventory...</div>
              </div>
            );
          }

          return (
            <div style={{ background: "#0D1117", minHeight: "100vh", fontFamily: "Inter, sans-serif", color: "#E8E0D0" }}>
              {showHistory && <HistoryView history={history} onClose={() => setShowHistory(false)} />}
              {showAdd && <AddBottleModal onAdd={addBottle} onClose={() => setShowAdd(false)} />}
              
              {/* Header */}
              <div style={{ background: "#0D1117", borderBottom: "1px solid #1C2333", padding: "16px 16px 0", position: "sticky", top: 0, zIndex: 10 }}>
                <div style={{ maxWidth: 500, margin: "0 auto" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                    <div>
                      <div style={{ fontFamily: "'Playfair Display', serif", color: "#C9A84C", fontSize: 20, fontWeight: 700 }}>Night Count</div>
                      <div style={{ fontSize: 11, color: "#4B5563", marginTop: 3 }}>{formatDate(getTodayKey())}</div>
                    </div>
                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      <button onClick={() => setShowHistory(true)} style={{ background: "none", border: "1px solid #2D3748", borderRadius: 8, padding: "6px 10px", color: "#6B7280", cursor: "pointer", fontSize: 12 }}>History</button>
                      <button onClick={saveCount} style={{ background: saved ? "#1C4A2F" : "#C9A84C", border: "none", borderRadius: 8, padding: "6px 14px", color: saved ? "#6EE7A0" : "#0D1117", cursor: "pointer", fontSize: 12, fontWeight: 700, transition: "all 0.2s" }}>
                        {saved ? "✓ Saved" : "Save Count"}
                      </button>
                    </div>
                  </div>
                  
                  {/* Stats Bar */}
                  <div style={{ display: "flex", gap: 16, marginBottom: 12, alignItems: "baseline" }}>
                    <div style={{ fontSize: 11, color: "#6B7280" }}>
                      <span style={{ fontSize: 18, fontWeight: 700, color: "#E8E0D0" }}>{counted}</span>
                      <span style={{ color: "#4B5563" }}> / {bottles.length}</span> counted
                    </div>
                    {orderCount > 0 && (
                      <div style={{ fontSize: 11, color: "#C9643C" }}>
                        <span style={{ fontSize: 18, fontWeight: 700 }}>{orderCount}</span> to order
                      </div>
                    )}
                    {counted === bottles.length && bottles.length > 0 && (
                      <div style={{ fontSize: 11, color: "#6EE7A0", marginLeft: "auto", fontWeight: 600 }}>All Counted!</div>
                    )}
                  </div>

                  {/* Progress Bar */}
                  <div style={{ height: 3, background: "#1C2333", borderRadius: 2, marginBottom: 12 }}>
                    <div style={{ height: 3, borderRadius: 2, background: "#C9A84C", width: bottles.length > 0 ? `${(counted / bottles.length) * 100}%` : "0%", transition: "width 0.3s ease" }} />
                  </div>

                  {/* Category Tabs */}
                  <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 12 }}>
                    {usedCategories.map(cat => (
                      <button key={cat} onClick={() => setActiveCategory(cat)} style={{ background: activeCategory === cat ? "#C9A84C" : "none", border: activeCategory === cat ? "none" : "1px solid #2D3748", borderRadius: 20, padding: "4px 12px", color: activeCategory === cat ? "#0D1117" : "#6B7280", cursor: "pointer", fontSize: 12, fontWeight: activeCategory === cat ? 700 : 400, whiteSpace: "nowrap", flexShrink: 0 }}>
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Bottle Grid */}
              <div style={{ maxWidth: 500, margin: "0 auto", padding: "16px 16px 100px" }}>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 10 }}>
                  {filtered.map(bottle => (
                    <BottleCard key={bottle.id} bottle={bottle} entry={entries[bottle.id] || { fill: null, notes: "" }} onUpdate={(patch) => updateEntry(bottle.id, patch)} onDelete={deleteBottle} />
                  ))}
                </div>
                
                {filtered.length === 0 && (
                  <div style={{ color: "#4B5563", textAlign: "center", marginTop: 40, fontSize: 14 }}>No bottles in this category.</div>
                )}

                <button onClick={() => setShowAdd(true)} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, width: "100%", marginTop: 16, background: "none", border: "1px dashed #2D3748", borderRadius: 12, padding: "14px 0", color: "#4B5563", cursor: "pointer", fontSize: 14 }}>
                  + Add Bottle
                </button>
              </div>

              {/* Floating Badge */}
              {orderCount > 0 && (
                <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: "#C9643C", borderRadius: 20, padding: "8px 20px", color: "#fff", fontSize: 13, fontWeight: 600, boxShadow: "0 4px 20px #C9643C66", pointerEvents: "none", zIndex: 40 }}>
                  {orderCount} bottle{orderCount > 1 ? "s" : ""} below par
                </div>
              )}
            </div>
          );
        }

        const root = tragedies = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BarInventory />);
    </script>
</body>
</html>
